[project]
name = "contract-review-backend"
# 版本号唯一来源：backend/app/__init__.py 的 __version__（见 [tool.hatch.version]）
dynamic = ["version"]
description = "合同审批审查系统 - 后端服务"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # 配置与校验
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    # 数据层
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "cryptography>=43",
    # 基础设施客户端
    "redis>=5.0",
    "minio>=7.2",
    # 文档解析
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "rapidocr-onnxruntime>=1.3",
    # LLM
    "openai>=1.50",
    "httpx>=0.27",
    # Windows 宿主能力（DOCX -> PDF）
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
# 从源码读取版本号，避免 pyproject 与运行时各写一份导致漂移
path = "app/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
